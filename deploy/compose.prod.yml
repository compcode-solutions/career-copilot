# Career Copilot (a hosted fork of AienTech/dossier, AGPL-3.0) on CompCode's
# Contabo VPS: compose + Traefik, same pattern as Relay_CCS/deploy/compose.prod.yml.
#
#   docker compose -p career -f deploy/compose.prod.yml \
#     --env-file /opt/apps/env/career.env up -d
#
# Phase A (spec 124 Amendment 1) runs upstream's released image unchanged,
# pinned by tag below. Nothing is built on the VPS. From Phase 2 on, the image
# is built from this fork instead.
#
# Values come from /opt/apps/env/career.env through interpolation only (no
# env_file), so the container receives exactly the variables listed here.
# The runbook is deploy/README.md.

name: career

networks:
  internal:
  coolify:
    external: true

services:
  # Named career-db, not db: the app is also on the shared coolify network,
  # where a plain "db" can resolve to another app's database container.
  career-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dossier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /opt/apps/env/career.env}
      POSTGRES_DB: dossier
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory, so mount the parent (as upstream does).
      - career_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dossier -d dossier"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    # Only the app reaches the database. No published ports.
    networks: [internal]

  app:
    # Upstream release tag, never latest. To upgrade: read the release notes,
    # change the tag in a PR, merge; the deploy workflow restarts it.
    image: ghcr.io/aientech/dossier:${DOSSIER_IMAGE_TAG:-v1.9.2}
    restart: unless-stopped
    depends_on:
      career-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dossier:${POSTGRES_PASSWORD}@career-db:5432/dossier
      DOSSIER_PASSWORD: ${DOSSIER_PASSWORD:?Set DOSSIER_PASSWORD in /opt/apps/env/career.env (an argon2id hash from hash-password)}
      DOSSIER_SECRET: ${DOSSIER_SECRET:?Set DOSSIER_SECRET in /opt/apps/env/career.env}
      DOSSIER_BACKUP_RETENTION_DAYS: ${DOSSIER_BACKUP_RETENTION_DAYS:-7}
      # Upstream's nightly backup runs at 03:00 in this time zone.
      TZ: ${TZ:-Asia/Kolkata}
      DOSSIER_AI_PROVIDER: ${DOSSIER_AI_PROVIDER:-}
      DOSSIER_AI_URL: ${DOSSIER_AI_URL:-}
      DOSSIER_AI_MODEL: ${DOSSIER_AI_MODEL:-}
      DOSSIER_AI_KEY: ${DOSSIER_AI_KEY:-}
      DOSSIER_AI_TIMEOUT_SECONDS: ${DOSSIER_AI_TIMEOUT_SECONDS:-}
      # Off: no usage ping from our server (upstream asks after sign-in when unset).
      DOSSIER_TELEMETRY: ${DOSSIER_TELEMETRY:-off}
      DOSSIER_JOBS_SOURCE: ${DOSSIER_JOBS_SOURCE:-}
      DOSSIER_JSEARCH_KEY: ${DOSSIER_JSEARCH_KEY:-}
      DOSSIER_JSEARCH_HOST: ${DOSSIER_JSEARCH_HOST:-}
      DOSSIER_ADZUNA_APP_ID: ${DOSSIER_ADZUNA_APP_ID:-}
      DOSSIER_ADZUNA_KEY: ${DOSSIER_ADZUNA_KEY:-}
      DOSSIER_GOOGLE_CLIENT_ID: ${DOSSIER_GOOGLE_CLIENT_ID:-}
      DOSSIER_GOOGLE_CLIENT_SECRET: ${DOSSIER_GOOGLE_CLIENT_SECRET:-}
      DOSSIER_PUBLIC_URL: ${DOSSIER_PUBLIC_URL:-https://career.compcodesolutions.com}
    volumes:
      # Upstream writes its nightly backups and export zips to /data. A host
      # folder (owned by uid 1000, the image's "node" user) keeps them on the
      # VPS SSD next to the other apps' backups.
      - /opt/backups/career:/data
    # Room for Chromium, which prints the PDFs (upstream's value).
    mem_limit: 1g
    # The image has its own HEALTHCHECK on /api/health.
    networks: [internal, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.career.rule=Host(`career.compcodesolutions.com`)
      - traefik.http.routers.career.entrypoints=https
      - traefik.http.routers.career.tls=true
      - traefik.http.routers.career.tls.certresolver=letsencrypt
      - traefik.http.routers.career-http.rule=Host(`career.compcodesolutions.com`)
      - traefik.http.routers.career-http.entrypoints=http
      - traefik.http.routers.career-http.middlewares=career-https-redirect
      - traefik.http.middlewares.career-https-redirect.redirectscheme.scheme=https
      - traefik.http.services.career.loadbalancer.server.port=3000
      - coolify.managed=false

volumes:
  career_pg:
